<div class="page-header">

  <div>
    <h1>Items</h1>
    <p>Manage inventory items and stock information.</p>
  </div>

  <button class="primary-btn">
    + Add Item
  </button>

</div>


<div class="content-card">

  <div class="toolbar">

    <div class="search-box">

      <span>⌕</span>

      <input
        type="text"
        [(ngModel)]="searchText"
        placeholder="Search item...">

    </div>

    <button class="filter-btn">
      ⚙ Filter
    </button>

  </div>


  <!-- Table when there is data -->
  <div class="table-wrapper" *ngIf="!hasError && filteredItems.length > 0">

    <table>

      <thead>

        <tr>

          <th>ITEM CODE</th>
          <th>ITEM NAME</th>
          <th>CATEGORY</th>
          <th>UNIT</th>
          <th>STOCK</th>
          <th>RATE</th>
          <th>STATUS</th>
          <th>ACTION</th>

        </tr>

      </thead>


      <tbody>

        <tr *ngFor="let item of filteredItems">

          <td>
            <strong class="item-code">
              {{ item.code }}
            </strong>
          </td>

          <td>
            <strong>
              {{ item.name }}
            </strong>
          </td>

          <td>
            {{ item.category }}
          </td>

          <td>
            {{ item.unit }}
          </td>

          <td>
            {{ item.stock | number }}
          </td>

          <td>
            ₹{{ item.rate }}
          </td>

          <td>

            <span
              class="status"
              [class.inactive]="item.status !== 'Active'">

              {{ item.status }}

            </span>

          </td>

          <td>

            <button class="action-btn">
              ⋮
            </button>

          </td>

        </tr>

      </tbody>

    </table>

  </div>

  <!-- Search Filter Empty (Search did not match any items) -->
  <div class="search-empty-state" *ngIf="!hasError && items.length > 0 && filteredItems.length === 0">
    <p>No items found matching "<strong>{{ searchText }}</strong>"</p>
    <button class="clear-search-btn" (click)="searchText = ''">
      Clear Search
    </button>
  </div>

  <!-- Failed / No Data Chrome Dino Game -->
  <div class="no-data-game-container" *ngIf="hasError || (!loading && items.length === 0)">
    <app-dino-game
      [message]="hasError ? 'API Connection Failed' : 'No Data Available'"
      [subMessage]="hasError ? 'Unable to fetch items from the server. Play the Dino runner while retrying!' : 'No items found in the inventory. Enjoy a quick run while we wait!'"
      (retry)="loadItems()">
    </app-dino-game>
  </div>

</div>
